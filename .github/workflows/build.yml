name: Build portable releases

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to build
        required: true
        default: windows
        type: choice
        options:
          - windows
          - macos
          - all
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

defaults:
  run:
    working-directory: CoupaTurboDownloader

jobs:
  build-windows:
    name: Build Windows executable
    if: github.event_name == 'push' || inputs.target == 'windows' || inputs.target == 'all'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install project and build dependencies
        run: uv sync --package coupaturbodownloader --group dev --group build --locked

      - name: Install Playwright Chromium
        run: uv run --package coupaturbodownloader playwright install chromium

      - name: Run tests
        run: uv run --package coupaturbodownloader pytest -q -m "not integration"

      - name: Build Windows executable
        run: uv run --package coupaturbodownloader --group build python build.py --windows

      - name: Verify Windows executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/CoupaTurboDownloader.exe")) {
            throw "Windows executable was not generated"
          }
          Get-Item "dist/CoupaTurboDownloader.exe" | Format-List Name,Length,LastWriteTime

      - name: Package Windows release
        shell: pwsh
        run: Compress-Archive -Path dist/CoupaTurboDownloader.exe -DestinationPath dist/CoupaTurboDownloader-windows-x64.zip -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: CoupaTurboDownloader/dist/CoupaTurboDownloader-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build macOS application
    if: github.event_name == 'push' || inputs.target == 'macos' || inputs.target == 'all'
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install project and build dependencies
        run: uv sync --package coupaturbodownloader --group dev --group build --locked

      - name: Install Playwright Chromium
        run: uv run --package coupaturbodownloader playwright install chromium

      - name: Run tests
        run: uv run --package coupaturbodownloader pytest -q -m "not integration"

      - name: Build macOS application
        run: uv run --package coupaturbodownloader --group build python build.py --macos

      - name: Verify macOS application
        run: test -d dist/CoupaTurboDownloader.app

      - name: Package macOS release
        run: ditto -c -k --sequesterRsrc --keepParent dist/CoupaTurboDownloader.app dist/CoupaTurboDownloader-macos.zip

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: CoupaTurboDownloader/dist/CoupaTurboDownloader-macos.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: release-assets

      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: macos-package
          path: release-assets

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum *.zip > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
