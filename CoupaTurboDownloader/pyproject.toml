[project]
name = "coupaturbodownloader"
version = "0.1.0"
description = "Coupa Turbo Downloader — high-performance PO attachment download engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "extract-msg>=0.55.0",
    "fpdf2>=2.8.4",
    "httpx[http2]>=0.27.2",
    "lxml>=6.1.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "playwright>=1.59.0",
    "pyinstaller>=6.20.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pywebview>=6.2.1",
    "selenium>=4.30.0",
]

[project.scripts]
coupa-turbo = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
